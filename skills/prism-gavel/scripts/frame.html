<style>
  /*
   * PRISM-GAVEL COCKPIT FRAME
   * Lifted from griot-live-artifacts HEAD live/dgs-definitive-plan.html — the ⚖ Gavel tab.
   * Design register: DGS ember tokens (NOT brainstorm's iris griotwave frame — the cockpit
   * carries its own #v-gavel .gv* system). Structured like brainstorm's frame-template.html:
   * a full document served by gavel's server.cjs, helper.js injected before </body>.
   */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap');
  :root{
    --bg:#0d0d10; --bg2:#131318; --panel:rgba(255,255,255,.035); --panel2:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.15);
    --tx:#e9e7e3; --tx2:#a7a49e; --tx3:#6f6c67;
    --ember:#e85d3a; --ember2:#f2915f; --amber:#e0a458; --neural:#7c7cf0; --bio:#57b98a; --voltage:#4fd0e0; --beacon:#e05d8a;
    --now:#e0a458; --next:#7c7cf0; --later:#6f6c67; --dark:#e05d8a;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  body{background:radial-gradient(1200px 700px at 78% -8%,rgba(232,93,58,.10),transparent 60%),radial-gradient(900px 600px at 8% 108%,rgba(124,124,240,.08),transparent 60%),var(--bg)}
  a{color:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}::-webkit-scrollbar-track{background:transparent}
  .mono{font-family:'JetBrains Mono',monospace}

  /* ===== cockpit shell ===== */
  #v-gavel{max-width:1180px;margin:0 auto;padding:26px 22px 60px}

  /* ===== verb bar (S3c — drive: the ONLY wake events) ===== */
  #v-gavel .gvverbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
  #v-gavel .gvverb{padding:6px 12px;border-radius:9px;border:1px solid var(--line2);background:rgba(79,208,224,.06);color:var(--voltage);cursor:pointer;font-size:11.5px;font-weight:600;font-family:inherit;letter-spacing:.01em}
  #v-gavel .gvverb:hover{border-color:var(--voltage);background:rgba(79,208,224,.16)}
  #v-gavel .gvcommit[data-verb]{cursor:pointer}

  #v-gavel .gvhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  #v-gavel .gvttl{font-size:18px} #v-gavel .gvsub{color:var(--tx2);font-size:12.5px}
  #v-gavel .gvexport{background:linear-gradient(180deg,var(--ember),#c0492b);color:#0d0d10;border:none;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:12.5px;font-family:inherit}
  #v-gavel .gvexport:hover{filter:brightness(1.07)}
  #v-gavel .gvpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;max-height:96px;overflow:auto}
  #v-gavel .gvchip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 11px;color:var(--tx2);cursor:pointer;font-size:12px;font-family:inherit;white-space:nowrap}
  #v-gavel .gvchip.on{background:rgba(232,93,58,.16);border-color:rgba(232,93,58,.5);color:var(--ember2)}
  #v-gavel .gvchip span{opacity:.6;font-size:10.5px;margin-left:3px}
  #v-gavel .gvbar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 13px;margin-bottom:12px}
  #v-gavel .gvlab{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
  #v-gavel .gvtrack{flex:1;display:flex;height:7px;border-radius:20px;overflow:hidden;background:rgba(0,0,0,.3)}
  #v-gavel .gvcount{font-size:12px;font-weight:600;white-space:nowrap}
  #v-gavel .gvbody{display:grid;grid-template-columns:1fr 260px;gap:12px;align-items:start}
  @media(max-width:820px){#v-gavel .gvbody{grid-template-columns:1fr}}
  #v-gavel .gvcard{background:linear-gradient(180deg,#1b1b22,#111015);border:1px solid var(--line2);border-radius:16px;padding:18px 20px;min-height:220px;display:flex;flex-direction:column}
  #v-gavel .gvk{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ember2)}
  #v-gavel .gvslug{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--tx3);margin-top:3px}.gvrepo{display:flex;flex-wrap:wrap;align-items:center;gap:5px 9px;margin-top:5px;font-size:11px;line-height:1.4}.gvlink{font-family:'JetBrains Mono',monospace;color:#ffb066;text-decoration:none}.gvlink:hover{text-decoration:underline}.gvbadge{font-size:10px;font-weight:600;padding:1px 7px;border-radius:20px;white-space:nowrap}.gvb-v{background:rgba(74,190,130,.15);color:#6fd6a0;border:1px solid rgba(74,190,130,.4)}.gvb-u{background:rgba(224,164,88,.15);color:#f0b866;border:1px solid rgba(224,164,88,.4)}.gvb-x{background:rgba(140,136,130,.14);color:var(--tx3);border:1px solid rgba(140,136,130,.32)}.gvstar{color:var(--tx3);font-family:'JetBrains Mono',monospace}.gvvid{color:var(--tx3);text-decoration:none;display:inline-flex;align-items:center;gap:3px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gvvid:hover{color:#ff7a7a;text-decoration:underline}

  #v-gavel .gvd{color:var(--tx2);font-size:13.5px;line-height:1.5;flex:1}

  #v-gavel .gvopts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  #v-gavel .gvopt{flex:1;min-width:70px;padding:9px 6px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--tx);cursor:pointer;font-size:12.5px;font-weight:500;font-family:inherit}
  #v-gavel .gvopt:hover{border-color:var(--ember);color:var(--ember2)}
  #v-gavel .gvdrawer{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
  #v-gavel .gvdh{font-size:11px}
  #v-gavel .gvrow{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;margin:5px 0;cursor:pointer}
  #v-gavel .gvrow.pk{border-color:rgba(224,164,88,.35)}
  #v-gavel .gvrow .n{color:var(--tx2);font-size:11px;margin-top:2px}
  #v-gavel .gvempty{font-size:11px;color:var(--tx3);font-style:italic}
  #v-gavel .gvwarn{font-size:11px;color:var(--amber);background:rgba(224,164,88,.14);border:1px solid var(--amber);border-radius:8px;padding:6px 8px;margin-top:6px;line-height:1.35}

  .gvmsub{color:var(--tx2);font-size:12px}

  #v-gavel .gvcommit{background:linear-gradient(180deg,var(--bio),#3f9d72);color:#08120d;border:none;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:12.5px;font-family:inherit}

  #v-gavel .gvaxes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  #v-gavel .gvax{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 11px;color:var(--tx3);cursor:pointer;font-size:11.5px;font-family:inherit}
  #v-gavel .gvax.on{background:rgba(79,208,224,.14);border-color:rgba(79,208,224,.5);color:var(--voltage)}
  #v-gavel .gvdeck{position:relative;min-height:380px}
  #v-gavel .gvdeck .gvcard{position:absolute;top:0;left:0;right:0;transition:transform .28s cubic-bezier(.22,1,.36,1),opacity .28s}
  #v-gavel .gvcard.behind{transform:translateY(calc(var(--pos) * 12px)) scale(calc(1 - var(--pos) * .04));opacity:calc(1 - var(--pos) * .3);pointer-events:none;filter:brightness(.82)}
  #v-gavel .gvcard.top{z-index:5;cursor:grab;touch-action:pan-y}
  #v-gavel .gvcard.top:active{cursor:grabbing}
  #v-gavel .gvcard.fly-left{transform:translateX(-140%) rotate(-16deg)!important;opacity:0}
  #v-gavel .gvcard.fly-right{transform:translateX(140%) rotate(16deg)!important;opacity:0}
  #v-gavel .gvtriple{margin-top:11px;display:flex;flex-direction:column;gap:7px}
  #v-gavel .gvtr{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  #v-gavel .gvtk{font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);width:32px;flex:none}
  #v-gavel .gvtr .gvopt{flex:none;min-width:0;padding:5px 11px;font-size:11.5px}
  #v-gavel .gvsub2{padding:5px 10px;border-radius:9px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--tx2);cursor:pointer;font-size:11.5px;font-family:inherit}
  #v-gavel .gvsub2:hover{border-color:var(--voltage);color:var(--voltage)}
  #v-gavel .gvsub2.cur{background:rgba(87,185,138,.16);border-color:var(--bio);color:var(--bio)}
  #v-gavel .gvopt.cur{background:rgba(87,185,138,.16);border-color:var(--bio);color:var(--bio)}
  .gvtoast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,var(--bio),#3f9d72);color:#08120d;padding:11px 18px;border-radius:12px;font-size:12.5px;font-weight:600;z-index:300;box-shadow:0 8px 30px rgba(0,0,0,.5)}
</style>

<!-- ============================================================
     GAVEL COCKPIT — lifted from griot-live-artifacts HEAD (the ⚖ Gavel tab IIFE).
     S3c drive rewrite (the only behavioral change vs. the lift):
       • use / role / stage / notes  → LOCAL mutation only (unchanged handlers). NO wake.
       • verb buttons [data-verb] (open · scan · verify · commit) → wake via helper.js →
         POST {skill:"gavel",verb,card_id,content} to the shared channel :52342.
     The verb buttons carry NO onclick here; helper.js catches [data-verb] by delegation
     (survives every draw() re-render). Export stays a pure-local copy modal (no wake).
     ============================================================ -->
<script>
// ---- Gavel v2 · one decision store · decide-anywhere · flick/stack ----
(function(){
  const R=document.getElementById('gavelRoot'); if(!R) return;
  const MARK='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;color:var(--voltage,#4fd0e0)" aria-hidden="true"><path d="M13 10l7.383 7.418c.823 .82 .823 2.148 0 2.967a2.11 2.11 0 0 1 -2.976 0l-7.407 -7.385"/><path d="M6 9l4 4"/><path d="M13 10l-4 -4"/><path d="M3 21h7"/><path d="M6.793 15.793l-3.586 -3.586a1 1 0 0 1 0 -1.414l2.293 -2.293l.5 .5l3 -3l-.5 -.5l2.293 -2.293a1 1 0 0 1 1.414 0l3.586 3.586a1 1 0 0 1 0 1.414l-2.293 2.293l-.5 -.5l-3 3l.5 .5l-2.293 2.293a1 1 0 0 1 -1.414 0"/></svg>';
  const nameOf=id=>{const a=appById[id]; return a?a.name:(id==='suite'?'Suite-wide':id);};
  const vertOf=id=>{const a=appById[id]; return a?a.vertical:'assistant';};
  const vertName=v=>{const x=VERTS.find(z=>z.id===v); return x?x.n:v;};
  // S4: hardened before wiring live/less-controlled data (gavel_state) into the cockpit.
  // Escapes & first, then < > " ' — so a card title with a quote can't break out of an
  // attribute (e.g. data-card-title="${esc(...)}"). Used for both text and attributes.
  const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  // ---- non-OSS decisions as first-class data + state ----
  const ARCHQ=[
    {t:'SkillForge — final name',d:'"Skill" ok, "Forge" disliked; Whetstone considered. Lock the name before scaffolding.',opts:['Skill','Whetstone','keep SkillForge','other']},
    {t:'Kaleidoscope ↔ Valence — boundary',d:'Write-path/intent (Kaleidoscope) vs read-path/history (Valence). Overlap unresolved.',opts:['keep separate','merge','K=write / V=read','defer']},
    {t:'Griot Hub — orchestrator vs mirror',d:'Ecosystem launcher: orchestrate the suite or just reflect it?',opts:['orchestrator','mirror','both','defer']},
    {t:'Lucid — final name',d:'idea_init codename; evolution of old Lucid + Brand Hub.',opts:['keep Lucid','idea_init','other']}
  ];
  const archChoice={}, gapChoice={}, launchSeq={}, parked={}, noteMap={};

  // ---- unified deck — OSS reads LIVE from the shared store (ossDecision/ossRole/ossStage) ----
  // S4: buildDeck() is re-runnable (keeps the same D reference so closures stay valid) so the
  // live hydration can rebuild the deck after gavel_state replaces ITEMS/ossItems.
  const D=[];
  function buildDeck(){
    D.length=0;
    ossItems.forEach(it=>D.push({id:it._id,kind:'oss',app:it.app,appName:nameOf(it.app),vert:vertOf(it.app),title:it.oss||it.item,sum:it.detail,slug:it.slug||'',ref:it}));
    ARCHQ.forEach((a,i)=>D.push({id:'arch'+i,kind:'arch',app:'suite',appName:'Suite-wide',vert:'assistant',title:a.t,sum:a.d,opts:a.opts}));
    GAPS.forEach((g,i)=>D.push({id:'gap'+i,kind:'gap',app:'suite',appName:'Suite-wide',vert:'assistant',title:g.g,sum:g.d,opts:['resolve','defer','drop']}));
    APPS.forEach(a=>D.push({id:'lc-'+a.id,kind:'launch',app:a.id,appName:a.name,vert:a.vertical,title:a.name,sum:(a.one||a.status||'')+' · now: '+(a.stage||'—'),opts:['launch now','next','later','hold']}));
  }
  buildDeck();

  const useOf=d=> d.kind==='oss'?(ossDecision[d.id]||'undecided'):d.kind==='arch'?(archChoice[d.id]||'undecided'):d.kind==='gap'?(gapChoice[d.id]||'undecided'):(launchSeq[d.id]||'undecided');
  const decided=d=>useOf(d)!=='undecided';
  const optsOf=d=> d.kind==='oss'?['adopt','trial','defer','pass']:d.opts;

  function setUse(d,v){
    const same=useOf(d)===v, nv=same?'':v;
    if(d.kind==='oss') ossDecision[d.id]=nv||'undecided';
    else if(d.kind==='arch') archChoice[d.id]=nv;
    else if(d.kind==='gap') gapChoice[d.id]=nv;
    else launchSeq[d.id]=nv;
    delete parked[d.id];
  }
  function crossReflect(){ try{renderOss();}catch(e){} try{renderGrid();}catch(e){} }

  // ---- grouping axes ----
  const AXES=[['project','by project'],['vertical','by vertical'],['decision','by decision'],['stage','by stage'],['type','by type']];
  let axis='project', active=null, idx=0;
  function keyOf(d){ return axis==='project'?d.appName:axis==='vertical'?vertName(d.vert):axis==='type'?d.kind:axis==='decision'?(d.kind==='oss'?useOf(d):'non-OSS'):(d.kind==='oss'?(ossStage[d.id]||'later'):'non-OSS'); }
  function groups(){ const c={}; D.forEach(d=>{const k=keyOf(d);c[k]=(c[k]||0)+1;});
    const ord={decision:['adopt','trial','defer','pass','undecided','non-OSS'],stage:['now','next','later','non-OSS'],type:['oss','arch','gap','launch']};
    const ks= ord[axis]? ord[axis].filter(k=>c[k]) : Object.keys(c).sort((a,b)=>c[b]-c[a]); return {ks,c}; }
  const inG=()=>D.filter(d=>keyOf(d)===active);
  const undecG=arr=>arr.filter(d=>!decided(d)&&!parked[d.id]).length;
  function nextUndecided(){ const g=inG(); for(let i=idx+1;i<g.length;i++){ if(!decided(g[i])&&!parked[g[i].id]){idx=i;return;} } idx=Math.min(g.length-1,idx+1); }

  // ---- card ----
  const VIDT={"-VlRHcpvjxI": "157-tool toolkit", "-kEOSut9oMI": "GitHub Trending Weekly #38", "0lAUBeTBtYY": "Syntax remote agents", "0t-5IfBRpY8": "Qwen Audio 3.0", "40dlEO_JD_8": "Pagecast: publish your agent's HTML straight to a live Cloudflare Pages URL", "5MKq5qahKQ8": "Impeccable — design skill for AI agents", "5n2Op3T-yUk": "Weave Router: proxy that picks the right model per request", "6YRpXxbtc2c": "Nub — Node toolkit review", "6fZ5TgW3u40": "GitHub Trending Weekly #37", "9NubqbSNbjg": "8 free design-component sites (vibe-coding)", "Alveu07gvvk": "ACE-Step UI", "CAKAIsUiTsI": "OpenWiki: CLI that generates & keeps your repo wiki current", "COte4lzHcdI": "35 self-hosted alts", "CYdzyCNvNm8": "Plane", "CizQBQKipVU": "20 dev-tools roundup", "DCCkBPcIVAo": "GitHub Awesome HN #10", "ERCdFgTXNY4": "Poolside Laguna", "GHQWvOViXGo": "Twenty CRM", "IDsdmdLfT0I": "Neko browser", "JKQwLV3MBMM": "GitHub Trending Today #37", "JmiQvaqQ_7M": "GH trending agent infra", "KITOm0HitpY": "20 AI agent tools", "KqL-2KEGqxc": "GH Trending #41", "LDXM3p83UsQ": "Code Review Graph", "QacqRZ0vsD4": "Free transcription app, YouTube scraper & GitHub's top repos", "Ti0jeXaaUis": "Flowise vs Langflow", "Ue6iTXSO1As": "AI Copywriter (Short)", "XNspkAPNTbM": "Tutti: one shared workspace for Claude Code & Codex", "YAcIUCjsRnU": "Thinking Machines model", "ZotwULorjwI": "GitHub Trending Today #39", "aVgR5YHk4QA": "Canvas UI", "bJGOxx0azas": "22 Self-Hosted Apps", "bPDb_fRvtvQ": "Qoder/Cantus", "csbM6kw5NG0": "Nanobot", "dQhOxW-nuRU": "20 trending agent repos", "doFmozbBkmI": "Mindwalk: replay Claude Code/Codex sessions as a 3D repo map", "eyDUqRu2Bgk": "Coreutils for Win", "fMaPaK4gcNE": "AI news roundup", "j__YOmUX0WI": "Kimi vs Claude (Blender)", "k92LeiSYPoQ": "scroll-world: scroll-driven camera flights through diorama scenes", "keillCm88ZY": "GH Trending #40", "lPZrLtM3JBI": "35 Self-hosted Projects on GitHub (vol. 2)", "m1uaDuHxNwE": "PhotoGIMP", "n0VhIVtviC0": "Prototype/Wayfinder", "peJr-6BRQ3M": "GH Trending Weekly #5", "sA2uZm0-W-g": "GitHub Trending Weekly #39", "sJYOOQ-FB7A": "self-learning-skills: meta-skill that saves agent solutions as rules", "sfmm3P9zX1Y": "agentcn: shadcn for AI agents — drop a complete agent recipe", "tX9ANddpAqc": "AI Video/Token Tricks", "tb4VYOIeq7w": "Open Knowledge: AI-native markdown editor & LLM wiki", "wAIW31__ghE": "claude-real-video: let Claude actually watch a video", "xOqTB_XpRUw": "Kage: shadow any website for offline viewing, JS stripped", "ywr_o3Tga0E": "Luz: a C++20 path tracer built from scratch, zero deps", "z6QVBXljJwk": "35 Self-hosted Projects on GitHub", "zKXSaxndXyE": "DocuSeal"};
  // S4: `let` + rebuild so live hydration can refresh RESMAP after RESOLVE is replaced.
  let RESMAP=Object.fromEntries(RESOLVE.map(o=>[o.n,o]));
  function rebuildResmap(){ RESMAP=Object.fromEntries(RESOLVE.map(o=>[o.n,o])); }
  const _clRepo=s=>!!s&&s.indexOf('/')>0&&s.indexOf('not OSS')<0&&s.charAt(0)!=='—'&&s.indexOf('http')!==0&&s.indexOf(' ')<0;
  const _site=s=>!!s&&s.indexOf('/')<0&&s.indexOf('.')>0&&s.indexOf(' ')<0&&s.indexOf('not OSS')<0&&s.charAt(0)!=='—';
  function repoMeta(d){
    const it=d.ref||{},name=d.title,src=(it.src||''),R=RESMAP[name];
    const vid=(src.indexOf('potluck:')===0)?src.slice(8):'';
    let url='',label='',tier='x',star=0,ext=false;
    if(_clRepo(d.slug)){url='https://github.com/'+d.slug;label=d.slug;tier=(R&&R.s==='v')?'v':'u';star=(R&&R.st)||0;}
    else if(R&&_clRepo(R.r)){url='https://github.com/'+R.r;label=R.r;tier=(R.s==='v')?'v':'u';star=R.st||0;}
    else if(_site(d.slug)){url='https://'+d.slug;label=d.slug;tier='u';ext=true;}
    else{url='https://github.com/search?q='+encodeURIComponent(name)+'&type=repositories';label='search “'+name+'”';tier='x';}
    return {url,label,tier,star,vid,ext};
  }
  function repoLinkHTML(d){
    const m=repoMeta(d);
    const W={v:'✓ verified',u:'~ unverified',x:'? unresolved'};
    const star=m.star?`<span class="gvstar">${m.star.toLocaleString()}★</span>`:'';
    let video='';
    if(m.vid){const tt=VIDT[m.vid]||'video';video=`<a class="gvvid" href="https://youtu.be/${m.vid}" target="_blank" rel="noopener" title="captured from: ${esc(tt)}">▶ ${esc(tt)}</a>`;}
    return `<div class="gvrepo"><a class="gvlink" href="${m.url}" target="_blank" rel="noopener">${m.ext?'↗ ':''}${esc(m.label)}</a>`+`<span class="gvbadge gvb-${m.tier}">${W[m.tier]}</span>`+star+video+`</div>`;
  }
  function cardHTML(d,pos){
    const top=pos===0;
    let controls='';
    if(top){
      if(d.kind==='oss'){
        const u=useOf(d), role=ossRole[d.id]||'', st=ossStage[d.id]||'';
        const uB=['adopt','trial','defer','pass'].map(o=>`<button class="gvopt ${u===o?'cur':''}" data-use="${o}">${o}</button>`).join('');
        const rB=[['scaffold','🏗️'],['component','🧩'],['pattern','💡']].map(([o,ic])=>`<button class="gvsub2 ${role===o?'cur':''}" data-role="${o}">${ic} ${o}</button>`).join('');
        const sB=['now','next','later'].map(o=>`<button class="gvsub2 ${st===o?'cur':''}" data-stage="${o}">${o}</button>`).join('');
        controls=`<div class="gvtriple"><div class="gvtr"><span class="gvtk">use</span>${uB}</div><div class="gvtr"><span class="gvtk">role</span>${rB}</div><div class="gvtr"><span class="gvtk">stage</span>${sB}</div></div>`;
      } else {
        controls=`<div class="gvopts">${optsOf(d).map(o=>`<button class="gvopt ${useOf(d)===o?'cur':''}" data-use="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
      }
    }
    // S3c: per-card verb bar (open · scan · verify). data-verb only — helper.js wakes Claude
    // by delegation. No local onclick; these are the wake events, not local mutations.
    const verbBar = top ? `<div class="gvverbs">
        <button class="gvverb" data-verb="open" data-card-id="${d.id}" data-card-title="${esc(d.title)}" title="Open this card's repo / ▶ video (wakes Claude)">↗ open</button>
        <button class="gvverb" data-verb="scan" data-card-id="${d.id}" data-card-title="${esc(d.title)}" title="Scan the Griot Potluck for this card (wakes Claude)">⌕ scan</button>
        <button class="gvverb" data-verb="verify" data-card-id="${d.id}" data-card-title="${esc(d.title)}" title="Verify this card's repo + stars (wakes Claude)">✓ verify</button>
      </div>` : '';
    return `<div class="gvcard ${top?'top':'behind'}" data-id="${d.id}" style="--pos:${pos}">
      <div class="gvk">${esc(d.kind)} · ${esc(d.appName)}</div>${d.kind==='oss'?repoLinkHTML(d):(d.slug?`<div class="gvslug">${esc(d.slug)}</div>`:'')}
      <div class="gvt">${esc(d.title)}</div><div class="gvd">${esc(d.sum)}</div>
      ${top?`<textarea class="gvnote" placeholder="note — your reasoning (kept with the decision)…">${esc(noteMap[d.id]||'')}</textarea>`:''}${controls}${verbBar}</div>`;
  }

  function draw(){
    const {ks,c}=groups();
    if(active===null||ks.indexOf(active)<0) active=ks[0];
    const g=inG(); if(idx>=g.length) idx=Math.max(0,g.length-1);
    const done=g.filter(decided).length, pk=g.filter(d=>parked[d.id]).length, tot=g.length;
    const axisBtns=AXES.map(([id,lbl])=>`<button class="gvax ${id===axis?'on':''}" data-ax="${id}">${lbl}</button>`).join('');
    const chips=ks.map(k=>`<button class="gvchip ${k===active?'on':''}" data-grp="${esc(k)}">${esc(k)} <span>${undecG(D.filter(d=>keyOf(d)===k))}/${c[k]}</span></button>`).join('');
    const deck=[];
    for(let i=0;i<Math.min(3,g.length-idx);i++) deck.push(cardHTML(g[idx+i],i));
    const deckHTML=g.length?deck.reverse().join(''):'<div class="gvcard top"><div class="gvd" style="margin:auto">All decided in this group ✓</div></div>';
    const dr=g.filter(decided).map(d=>`<div class="gvrow" data-jump="${d.id}"><b>${esc(d.title)}</b> → <span style="color:var(--bio)">${esc(useOf(d))}</span>${d.kind==='oss'&&ossRole[d.id]?` <span style="color:var(--tx3)">· ${ossRole[d.id]}</span>`:''}</div>`).join('')||'<div class="gvempty">nothing yet</div>';
    const pr=g.filter(d=>parked[d.id]).map(d=>`<div class="gvrow pk" data-jump="${d.id}"><b>${esc(d.title)}</b></div>`).join('');
    R.innerHTML=`<div class="gvhead"><div><b class="gvttl">${MARK} Gavel</b> <span class="gvsub">one store · decide here, it flips everywhere → prism-plans</span></div>
        <div class="gvactions"><button class="gvcommit" id="gvCommit" data-verb="commit">Commit ⚑</button><button class="gvexport" id="gvExport">Export ↗</button></div></div>
      <div class="gvaxes">${axisBtns}</div>
      <div class="gvpick">${chips}</div>
      <div class="gvbar"><span class="gvlab">${esc(active)}</span><div class="gvtrack"><span style="width:${tot?done/tot*100:0}%;background:var(--bio)"></span><span style="width:${tot?1/tot*100:0}%;background:var(--ember)"></span><span style="width:${tot?pk/tot*100:0}%;background:var(--amber)"></span></div><span class="gvcount">${Math.min(idx+1,tot)} of ${tot}${pk?` · <span style="color:var(--amber)">${pk} parked</span>`:''}</span></div>
      <div class="gvbody"><div class="gvdeck" id="gvDeck">${deckHTML}</div>
        <div class="gvdrawer"><div class="gvdh" style="color:var(--bio)">✓ Decided · ${done}</div>${dr}<div class="gvdh" style="color:var(--amber);margin-top:8px">◷ Parked · ${pk}</div>${pr}${pk>=5?'<div class="gvwarn">⚠ Long parking lot — narrow the scope.</div>':''}</div></div>
      <div class="gvnav"><button class="gvbtn" id="gvPrev">‹</button><span class="gvhint">drag the card · decide or park · ‹ › to move</span><button class="gvbtn" id="gvNext">›</button><button class="gvpark" id="gvPark">Park ◷</button></div>`;
    const cc=document.getElementById('c-gavel'); if(cc) cc.textContent=D.filter(d=>!decided(d)).length;
    bind();
  }

  function fly(dir,after){ const t=R.querySelector('.gvcard.top'); if(t){ t.style.transition='transform .22s cubic-bezier(.22,1,.36,1),opacity .22s'; t.classList.add(dir==='prev'?'fly-right':'fly-left'); } setTimeout(()=>{ after(); draw(); crossReflect(); }, dir?200:0); }

  function bind(){
    R.querySelectorAll('[data-ax]').forEach(b=>b.onclick=()=>{axis=b.dataset.ax;active=null;idx=0;draw();});
    R.querySelectorAll('[data-grp]').forEach(b=>b.onclick=()=>{active=b.dataset.grp;idx=0;draw();});
    // LOCAL (no wake): use / role / stage / notes mutate the local cockpit store + re-render.
    R.querySelectorAll('.gvcard.top [data-use]').forEach(b=>b.onclick=()=>{const d=inG()[idx]; if(!d)return; setUse(d,b.dataset.use); fly('next',nextUndecided);});
    R.querySelectorAll('.gvcard.top [data-role]').forEach(b=>b.onclick=()=>{const d=inG()[idx]; if(d&&d.kind==='oss'){ossRole[d.id]=ossRole[d.id]===b.dataset.role?'':b.dataset.role; draw(); crossReflect();}});
    R.querySelectorAll('.gvcard.top [data-stage]').forEach(b=>b.onclick=()=>{const d=inG()[idx]; if(d&&d.kind==='oss'){ossStage[d.id]=ossStage[d.id]===b.dataset.stage?'':b.dataset.stage; draw(); crossReflect();}});
    const ta=R.querySelector('.gvcard.top .gvnote'); if(ta) ta.oninput=()=>{const d=inG()[idx]; if(d)noteMap[d.id]=ta.value;};
    const pk=document.getElementById('gvPark'); if(pk) pk.onclick=()=>{const d=inG()[idx]; if(!d)return; parked[d.id]=1; fly('next',nextUndecided);};
    const pv=document.getElementById('gvPrev'); if(pv) pv.onclick=()=>fly('prev',()=>{idx=Math.max(0,idx-1);});
    const nx=document.getElementById('gvNext'); if(nx) nx.onclick=()=>fly('next',()=>{idx=Math.min(inG().length-1,idx+1);});
    R.querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>{const i=inG().findIndex(d=>d.id===el.dataset.jump); if(i>=0){idx=i;draw();}});
    // S3c: #gvCommit is now data-verb="commit" — WAKE via helper.js delegation (no local onclick).
    const ex=document.getElementById('gvExport'); if(ex) ex.onclick=()=>doExport(false);
    bindDrag();
  }

  function bindDrag(){
    const c=R.querySelector('.gvcard.top'); if(!c) return;
    let sx=null,dx=0,drag=false;
    c.addEventListener('pointerdown',e=>{ if(e.target.closest('button,textarea'))return; sx=e.clientX;drag=true;dx=0;c.style.transition='none'; try{c.setPointerCapture(e.pointerId);}catch(_){}});
    c.addEventListener('pointermove',e=>{ if(!drag)return; dx=e.clientX-sx; c.style.transform=`translateX(${dx}px) rotate(${dx/30}deg)`; });
    const end=()=>{ if(!drag)return; drag=false; c.style.transition='transform .22s cubic-bezier(.22,1,.36,1),opacity .22s';
      if(dx<-70) fly('next',()=>{idx=Math.min(inG().length-1,idx+1);});
      else if(dx>70) fly('prev',()=>{idx=Math.max(0,idx-1);});
      else c.style.transform=''; };
    c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end); c.addEventListener('pointerleave',end);
  }

  function payload(){ const out={prism_plan_decisions:{},architecture:[],gaps:[],launch:{}};
    D.forEach(d=>{ if(!decided(d))return; const v=useOf(d), note=noteMap[d.id]||undefined;
      if(d.kind==='oss'){(out.prism_plan_decisions[d.appName]=out.prism_plan_decisions[d.appName]||[]).push({tool:d.title,slug:d.slug,decision:v,role:ossRole[d.id]||undefined,stage:ossStage[d.id]||undefined,note});}
      else if(d.kind==='arch') out.architecture.push({question:d.title,choice:v,note});
      else if(d.kind==='gap') out.gaps.push({gap:d.title,choice:v,note});
      else out.launch[d.title]={sequence:v,note}; });
    return out; }

  // S3c: doCommit is retained ONLY as the payload builder helper.js reads for the commit wake.
  // The Commit button no longer calls it locally; commit routes through the channel (S4).
  window.__gavelPayload = payload;

  function toast(m){ const t=document.createElement('div'); t.className='gvtoast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3400); }
  window.__gavelToast = toast;
  function doExport(fromCommit){ const n=D.filter(decided).length, json=JSON.stringify(payload(),null,2);
    const w=document.createElement('div'); w.className='gvmodal';
    w.innerHTML=`<div class="gvmbox"><div class="gvmh"><b>${fromCommit?'Commit unavailable — copy instead':'Export'} · ${n} decisions</b><button id="gvClose">✕</button></div><p class="gvmsub">${fromCommit?'sendPrompt isn’t available here, so paste this into the plan session to commit it.':'Paste into the prism-plan session. Only decided items (with role + stage) are included.'}</p><textarea class="gvout" readonly>${json.replace(/</g,'&lt;')}</textarea><button class="gvexport" id="gvCopy">Copy JSON</button></div>`;
    document.body.appendChild(w);
    w.querySelector('#gvClose').onclick=()=>w.remove(); w.onclick=e=>{if(e.target===w)w.remove();};
    w.querySelector('#gvCopy').onclick=()=>{const t=w.querySelector('.gvout');t.select();try{navigator.clipboard.writeText(json);}catch(e){}}; }

  // ---- S4: live hydration ----------------------------------------------------------
  // The baked ITEMS/RESOLVE render immediately (offline-safe fallback). Then we fetch the
  // live shelf that gavel_state parsed from the plan at git HEAD and wrote to STATE_DIR
  // (served at /state/gavel-cards.json). If it carries cards, it REPLACES the baked
  // snapshot as the source of truth — this is the "static ITEMS lift stopgap" removal:
  // the cockpit now shows the current undecided shelf, not the S3-time bake.
  async function hydrateLiveState(){
    try{
      const res=await fetch('/state/gavel-cards.json',{cache:'no-store'});
      if(!res.ok) return;
      const j=await res.json();
      if(!j||!Array.isArray(j.cards)||j.cards.length===0) return;
      ITEMS=j.cards;                                   // live undecided shelf (oss-inspo, _id-carrying)
      if(Array.isArray(j.resolve)) RESOLVE=j.resolve;  // live star/verification map
      deriveOssFromItems();
      buildDeck();
      rebuildResmap();
      active=null; idx=0;
      draw(); crossReflect();
      if(window.__gavelToast) window.__gavelToast('Live shelf loaded — '+j.cards.length+' undecided'+(j.head?' @ '+j.head:''));
    }catch(_){ /* keep the baked fallback */ }
  }

  buildDeck(); rebuildResmap(); draw();
  hydrateLiveState();
})();
</script>
